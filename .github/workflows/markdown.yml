name: Markdown checks
on:
  pull_request:
    paths: ['**.md', '.github/**']
  push:
    branches: [main]
    paths: ['**.md', '.github/**']
jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: '**/*.md'
