name: Documentation structure
on:
  pull_request:
  push:
    branches: [main]
jobs:
  required-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check standard files
        shell: bash
        run: |
          set -euo pipefail
          for file in README.md CONTRIBUTING.md PROJECT_STATE.md .github/PULL_REQUEST_TEMPLATE.md; do test -f "$file"; done
